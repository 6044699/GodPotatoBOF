name: Cross Compile GodPotatoBOF

on: 
  workflow_dispatch: # 支持网页手动点击一键运行

jobs:
  mingw-build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Linux 交叉编译器和编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 mingw-w64 make

      - name: 3. 强行赋予原厂链接器执行权限
        run: |
          chmod +x ./boflink

      - name: 4. 执行原厂一键自动化编译
        run: |
          make

      - name: 5. 打包并上传无任何符号缺失的完美成品
        uses: actions/upload-artifact@v4
        with:
          name: GodPotatoBOF-Perfect-Output
          path: dist/
