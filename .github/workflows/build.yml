name: Cross Compile GodPotatoBOF

on: 
  workflow_dispatch: # 支持网页手动点击一键运行

jobs:
  mingw-build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 强行安装 Windows 64位交叉编译器
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 mingw-w64 make

      - name: 3. 验证编译器是否存在
        run: |
          x86_64-w64-mingw32-gcc --version

      - name: 4. 执行编译
        run: |
          mkdir -p build
          make

      - name: 5. 打包并上传编译好的产物
        uses: actions/upload-artifact@v4
        with:
          name: GodPotatoBOF-x64-O-File
          path: |
            build/
            *.o
