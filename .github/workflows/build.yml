name: Cross Compile GodPotatoBOF

on: 
  workflow_dispatch:

jobs:
  mingw-build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 安装编译器
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 mingw-w64

      - name: 3. 一句话原生强制编译（加入标准库符号映射与头文件目录）
        run: |
          x86_64-w64-mingw32-gcc -nostdlib -o entry.x64.o -I. -Icommon -I/usr/share/mingw-w64/include/ -Os -c -DBOF -fno-builtin -mno-stack-arg-probe GodPotato.c

      - name: 4. 打包并上传
        uses: actions/upload-artifact@v4
        with:
          name: GodPotatoBOF-x64-O-File
          path: entry.x64.o
